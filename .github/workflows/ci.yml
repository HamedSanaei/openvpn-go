name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go test and static checks
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Build and test without cgo
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
