name: Upstream provenance review

on:
  schedule:
    - cron: '15 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record public release and advisory metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir upstream
          date -u +%F > upstream/review-date.txt
          for project in openvpn openvpn3; do
            gh api "repos/OpenVPN/$project/releases?per_page=20" --jq +              '[.[] | select(.draft == false) | {tag_name, published_at, prerelease, html_url}]' +              > "upstream/$project-releases.json"
            gh api "repos/OpenVPN/$project/security-advisories?per_page=20" --jq +              '[.[] | select(.state == "published") | {ghsa_id, cve_id, severity, published_at, html_url}]' +              > "upstream/$project-advisories.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openvpn-upstream-review
          path: upstream/
