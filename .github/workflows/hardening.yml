name: Hardening evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  openvpn3:
    name: OpenVPN 3 Core differential conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build pinned test references
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            iproute2 libasio-dev libcap-dev libcap-ng-dev libfmt-dev liblz4-dev liblzo2-dev \
            libjsoncpp-dev libssl-dev libxxhash-dev
          peer="$(bash tests/interop/build-peer.sh 2.6.23 "$RUNNER_TEMP/openvpn")"
          core="$(bash tests/interop/build-openvpn3.sh "$RUNNER_TEMP/openvpn3")"
          echo "OPENVPN_INTEROP_BIN=$peer" >> "$GITHUB_ENV"
          echo "OPENVPN3_INTEROP_BIN=$core" >> "$GITHUB_ENV"
          echo "OPENVPN3_INTEROP_SHA256=$(cut -d ' ' -f1 "$RUNNER_TEMP/openvpn3/ovpncli.sha256")" >> "$GITHUB_ENV"
      - name: Compare isolated client sessions
        run: |
          go mod download
          mkdir -p evidence
          "$OPENVPN3_INTEROP_BIN" --version > evidence/openvpn3-version.txt
          "$OPENVPN_INTEROP_BIN" --version > evidence/server-version.txt
          report="$RUNNER_TEMP/openvpn3-comparison.json"
          sudo env PATH="$PATH" GOTOOLCHAIN=local GOMODCACHE="$(go env GOMODCACHE)" GOPROXY=off \
            OPENVPN_INTEROP_BIN="$OPENVPN_INTEROP_BIN" OPENVPN3_INTEROP_BIN="$OPENVPN3_INTEROP_BIN" \
            OPENVPN3_INTEROP_SHA256="$OPENVPN3_INTEROP_SHA256" OPENVPN3_COMPARISON_JSON="$report" \
            unshare --net --mount bash -c 'ip link set lo up && exec go test -race -count=1 -timeout 3m -v -run "^TestOpenVPN3Differential$" ./tests/interop' \
            | tee evidence/openvpn3-tests.txt
      - name: Collect comparison on pass or failure
        if: always()
        run: |
          report="$RUNNER_TEMP/openvpn3-comparison.json"
          if sudo test -f "$report"; then
            sudo cat "$report" > evidence/openvpn3-comparison.json
          fi
      - name: Measure the same userspace workload on all three clients
        run: |
          set -o pipefail
          go build -o "$RUNNER_TEMP/ovpn-go-bench" ./cmd/ovpn-xray
          sudo env PATH="$PATH" GOTOOLCHAIN=local GOMODCACHE="$(go env GOMODCACHE)" GOPROXY=off \
            OPENVPN_INTEROP_BIN="$OPENVPN_INTEROP_BIN" OPENVPN3_INTEROP_BIN="$OPENVPN3_INTEROP_BIN" \
            OPENVPN3_INTEROP_SHA256="$OPENVPN3_INTEROP_SHA256" OPENVPN_GO_BENCH_BIN="$RUNNER_TEMP/ovpn-go-bench" \
            unshare --net --mount sh -c 'ip link set lo up && exec go test -count=1 -v -timeout 3m -run "^TestComparativeBenchmark$" ./tests/interop' \
            | tee evidence/comparative-benchmark.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: openvpn3-conformance
          path: evidence/

  xray:
    name: Xray 26.10.21 egress
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build reference and verify the pinned Xray binary
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libcap-ng-dev liblz4-dev liblzo2-dev
          peer="$(bash tests/interop/build-peer.sh 2.6.23 "$RUNNER_TEMP/openvpn")"
          xray="$(bash tests/interop/build-xray-peer.sh "$RUNNER_TEMP/xray")"
          echo "OPENVPN_INTEROP_BIN=$peer" >> "$GITHUB_ENV"
          echo "XRAY_INTEROP_BIN=$xray" >> "$GITHUB_ENV"
      - name: Test routed traffic and reconnect
        run: |
          go mod download
          mkdir -p evidence
          "$XRAY_INTEROP_BIN" version > evidence/xray.txt
          sudo env PATH="$PATH" GOTOOLCHAIN=local GOMODCACHE="$(go env GOMODCACHE)" GOPROXY=off \
            OPENVPN_INTEROP_BIN="$OPENVPN_INTEROP_BIN" XRAY_INTEROP_BIN="$XRAY_INTEROP_BIN" \
            unshare --net --mount sh -c 'ip link set lo up && exec go test -race -json -count=1 -timeout 3m -run "^TestXrayEgressOpenVPN26$" ./tests/interop' \
            | tee evidence/xray-interop.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xray-interop
          path: evidence/

  interop:
    name: Interop OpenVPN ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["2.6.22", "2.6.23", "2.7.9"]
    env:
      OPENVPN_INTEROP_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build signed and checksum-pinned test peer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libcap-ng-dev liblz4-dev liblzo2-dev
          peer="$(bash tests/interop/build-peer.sh "$OPENVPN_INTEROP_VERSION" "$RUNNER_TEMP/openvpn")"
          echo "OPENVPN_INTEROP_BIN=$peer" >> "$GITHUB_ENV"
      - name: Test in an isolated network namespace
        run: |
          go mod download
          mkdir -p evidence
          go version > evidence/toolchain.txt
          "$OPENVPN_INTEROP_BIN" --version > evidence/openvpn.txt
          sudo env PATH="$PATH" GOTOOLCHAIN=local GOMODCACHE="$(go env GOMODCACHE)" GOPROXY=off \
            OPENVPN_INTEROP_BIN="$OPENVPN_INTEROP_BIN" OPENVPN_INTEROP_VERSION="$OPENVPN_INTEROP_VERSION" \
            unshare --net sh -c 'ip link set lo up && exec go test -race -json -count=1 -timeout 5m ./tests/interop' \
            | tee evidence/interop.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interop-${{ matrix.version }}
          path: evidence/

  legacy:
    name: Legacy AEAD policy OpenVPN ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["2.4.12", "2.5.11"]
    env:
      OPENVPN_LEGACY_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build signed historical test peer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libcap-ng-dev
          peer="$(OPENVPN_BUILD_JOBS=4 bash tests/interop/build-peer.sh "$OPENVPN_LEGACY_VERSION" "$RUNNER_TEMP/openvpn")"
          echo "OPENVPN_LEGACY_BIN=$peer" >> "$GITHUB_ENV"
      - name: Record the isolated AEAD negotiation
        run: |
          go mod download
          mkdir -p evidence
          version_status=0
          "$OPENVPN_LEGACY_BIN" --version > evidence/openvpn.txt || version_status=$?
          test "$version_status" -le 1
          sudo env PATH="$PATH" GOTOOLCHAIN=local GOMODCACHE="$(go env GOMODCACHE)" GOPROXY=off \
            OPENVPN_LEGACY_BIN="$OPENVPN_LEGACY_BIN" OPENVPN_LEGACY_VERSION="$OPENVPN_LEGACY_VERSION" \
            unshare --net sh -c 'ip link set lo up && exec go test -race -json -count=1 -timeout 2m -run "^TestLegacyCommunityAEADPolicy$" ./tests/interop' \
            | tee evidence/legacy.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: legacy-${{ matrix.version }}
          path: evidence/

  fuzz:
    name: Campaign ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzProfile, FuzzTCPFrame, FuzzControlPacket, FuzzProtectedControl, FuzzDataPacket, FuzzControlPush]
    env:
      FUZZ_TIME: 2m
      FUZZ_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run fuzz target
        run: sh tests/fuzz/run.sh "$FUZZ_TARGET" | tee fuzz.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz.txt

  audit:
    name: Vulnerabilities, license and performance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify SPDX inventory and scan current vulnerabilities
        run: |
          mkdir -p evidence
          python3 tools/release_audit.py --check docs/sbom.spdx.json
          cp docs/sbom.spdx.json evidence/
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -show verbose ./... | tee evidence/govulncheck.txt
      - name: Exercise cancellation and shutdown under race detection
        run: go test -race -count=20 -timeout 5m ./client ./transport ./internal/session | tee evidence/race.txt
      - name: Verify benchmark budgets
        run: |
          make bench | tee evidence/benchmarks.txt
          python3 tools/check_benchmarks.py evidence/benchmarks.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-audit
          path: evidence/
